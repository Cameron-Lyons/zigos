name: Setup ZigOS CI
description: Install Zig and required build dependencies for CI jobs
inputs:
  zig-version:
    description: Zig version to install
    required: false
    default: ""
  install-build-dependencies:
    description: Install and verify OS build dependencies after Zig is available
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Resolve Zig version
      id: resolve-zig-version
      shell: bash
      run: |
        version="${{ inputs.zig-version }}"
        if [ -z "${version}" ]; then
          version="$(awk '$1 == "zig" { print $2; exit }' .tool-versions)"
        fi
        if [ -z "${version}" ]; then
          echo "Unable to resolve Zig version from input or .tool-versions" >&2
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: Install Zig
      uses: mlugg/setup-zig@v2.2.1
      with:
        version: ${{ steps.resolve-zig-version.outputs.version }}
        cache-key: zigos-ci-${{ steps.resolve-zig-version.outputs.version }}

    - name: Install Jujutsu
      uses: jdx/mise-action@v4
      with:
        install_args: jujutsu@0.43.0
        cache: true

    - name: Verify Zig version
      shell: bash
      run: |
        version="${{ steps.resolve-zig-version.outputs.version }}"
        actual="$(zig version)"
        if [ "${actual}" != "${version}" ]; then
          echo "Installed Zig version mismatch: expected ${version}, got ${actual}" >&2
          exit 1
        fi
        echo "Using Zig ${actual}"

    - name: Verify Jujutsu version
      shell: bash
      run: |
        actual="$(jj --version)"
        case "${actual}" in
          "jj 0.43.0"|"jj 0.43.0-"*) ;;
          *)
            echo "Installed Jujutsu version mismatch: expected jj 0.43.0, got ${actual}" >&2
            exit 1
            ;;
        esac
        echo "Using ${actual}"

    - name: Install build dependencies
      if: inputs.install-build-dependencies == 'true'
      shell: bash
      run: ./scripts/setup-deps.sh
