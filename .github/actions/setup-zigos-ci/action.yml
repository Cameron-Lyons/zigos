name: Setup ZigOS CI
description: Install Zig and required build dependencies for CI jobs
inputs:
  zig-version:
    description: Zig version to install
    required: false
    default: "0.17.0"
  install-build-dependencies:
    description: Install and verify OS build dependencies after Zig is available
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Install Zig
      uses: mlugg/setup-zig@v2.2.1
      with:
        version: ${{ inputs.zig-version }}
        cache-key: zigos-ci-${{ inputs.zig-version }}

    - name: Install Jujutsu
      uses: jdx/mise-action@v4
      with:
        install_args: jujutsu@0.43.0
        cache: true

    - name: Verify pinned toolchain
      shell: sh
      run: zig build tool -- ci-verify-toolchain

    - name: Initialize Jujutsu repository
      shell: sh
      run: zig build tool -- ci-init-jj

    - name: Install build dependencies
      if: inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build setup-deps

    - name: Enable KVM acceleration when available
      if: inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build tool -- ci-enable-kvm

    - name: Install isolated EFI authentication test tools
      if: inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build tool -- ci-setup-efi-tools
