name: Setup ZigOS CI
description: Install Zig and required build dependencies for CI jobs
inputs:
  zig-version:
    description: Zig version to install
    required: false
    default: "0.15.2"
runs:
  using: composite
  steps:
    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ inputs.zig-version }}

    - name: Install build dependencies
      shell: bash
      run: ./scripts/setup-deps.sh
