name: Setup ZigOS CI
description: Install Zig and required build dependencies for CI jobs
inputs:
  zig-version:
    description: Zig version to install
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve Zig version
      id: resolve-zig-version
      shell: bash
      run: |
        version="${{ inputs.zig-version }}"
        if [ -z "${version}" ]; then
          version="$(awk '$1 == "zig" { print $2; exit }' .tool-versions)"
        fi
        if [ -z "${version}" ]; then
          echo "Unable to resolve Zig version from input or .tool-versions" >&2
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: ${{ steps.resolve-zig-version.outputs.version }}

    - name: Install build dependencies
      shell: bash
      run: ./scripts/setup-deps.sh
