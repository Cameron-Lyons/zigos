name: Setup ZigOS CI
description: Install the Zig and Jujutsu versions pinned in .tool-versions and, optionally, the OS build dependencies
inputs:
  install-build-dependencies:
    description: Install and verify OS build dependencies after Zig is available
    required: false
    default: "true"
  install-efi-auth-tools:
    description: Install the isolated Secure Boot variable tools that unified-efi-qemu-test needs; ignored unless install-build-dependencies is also true
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Read pinned tool versions
      id: pins
      shell: sh
      run: awk 'NF == 2 { print $1 "=" $2 }' .tool-versions >> "$GITHUB_OUTPUT"

    - name: Install Zig
      uses: mlugg/setup-zig@v2.2.1
      with:
        version: ${{ steps.pins.outputs.zig }}
        cache-key: zigos-ci-${{ steps.pins.outputs.zig }}

    - name: Install Jujutsu
      uses: jdx/mise-action@v4
      with:
        install_args: jujutsu@${{ steps.pins.outputs.jujutsu }}
        cache: true

    - name: Verify pinned Jujutsu
      shell: sh
      run: zig build tool -- ci-verify-toolchain

    - name: Initialize Jujutsu repository
      shell: sh
      run: zig build tool -- ci-init-jj

    - name: Install build dependencies
      if: inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build setup-deps

    - name: Enable KVM acceleration when available
      if: inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build tool -- ci-enable-kvm

    - name: Install isolated EFI authentication test tools
      if: inputs.install-efi-auth-tools == 'true' && inputs.install-build-dependencies == 'true'
      shell: sh
      run: zig build tool -- ci-setup-efi-tools
