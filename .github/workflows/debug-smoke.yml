name: Debug Smoke

permissions:
  contents: read

on:
  schedule:
    # Nightly; Debug QEMU boots are too slow to gate every pull request,
    # but safety-checked builds catch corruption that ReleaseFast masks.
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  debug-native-smoke:
    name: Debug Native Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci

    - name: Run Debug native smoke test
      env:
        # Debug boots take several times the ReleaseFast wall time; give
        # each marker wait ample headroom on shared runners.
        ZIGOS_NATIVE_SECONDS: "1800"
      run: ./scripts/zig.sh build zigos-native-smoke-test
