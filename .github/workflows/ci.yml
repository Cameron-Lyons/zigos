name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2
        
    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh
        
    - name: Install zlint
      run: |
        curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.7.9/zlint-linux-x86_64 -o /usr/local/bin/zlint
        chmod +x /usr/local/bin/zlint

    - name: Lint
      run: |
        zlint -f github --deny-warnings src

  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Build kernel
      run: |
        zig build kernel

  boot-test:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Build ISO and boot test
      run: |
        zig build boot-test

    - name: Upload boot-test artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: boot-test-debug-${{ github.run_id }}
        retention-days: 7
        if-no-files-found: warn
        path: |
          build/boot-test-serial.log
          build/os.iso
