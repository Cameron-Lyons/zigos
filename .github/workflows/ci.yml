name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  zig-toolchain:
    name: Zig Toolchain Cache
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci
      with:
        install-build-dependencies: "false"

  lint:
    needs: zig-toolchain
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci
      with:
        install-build-dependencies: "false"

    - name: Install linters
      shell: sh
      run: zig build tool -- ci-install-linters

    - name: Run lint target
      env:
        ZIGOS_REQUIRE_ZLINT: "1"
        ZIGOS_REQUIRE_ACTIONLINT: "1"
      shell: sh
      run: zig build lint

  kernel-build:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Kernel Build
      command: zig build -Doptimize=fast kernel
      install-build-dependencies: false

  spec-conformance:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Spec Conformance
      command: zig build -Doptimize=fast spec-conformance

  host-tests:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Host Tests
      command: zig build host-tests
      install-build-dependencies: false

  native-smoke:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Native Smoke
      command: zig build -Doptimize=fast zigos-native-smoke-test
      timeout-minutes: 30

  long-mode-entry:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: x86-64 Boot Path
      command: zig build -Doptimize=fast x86_64-long-mode-entry-check x86_64-userspace-launch-check
      timeout-minutes: 30

  tpm-quotes:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: TPM Quotes
      command: TPM2_QEMU_SECONDS=180 zig build -Doptimize=fast tpm2-quote-qemu-test
      timeout-minutes: 20

  benchmark:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-summary-command.yml
    with:
      job-name: Native Benchmarks
      command: QEMU_ACCELERATOR=kvm zig build -Doptimize=fast benchmark
      log-path: build/kernel-benchmark.log
      summary-path: build/kernel-benchmark-summary.md
      artifact-name: kernel-benchmark
      timeout-minutes: 20

  iso:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Production and Verification ISO Build
      command: zig build -Doptimize=fast iso iso-verification
      timeout-minutes: 20
