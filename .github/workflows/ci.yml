name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci

    - name: Install zlint
      run: |
        curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.7.9/zlint-linux-x86_64 -o /usr/local/bin/zlint
        chmod +x /usr/local/bin/zlint

    - name: Install actionlint
      run: |
        curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
        tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
        install /tmp/actionlint /usr/local/bin/actionlint

    - name: Lint Zig sources
      run: |
        zlint -f github --deny-warnings src

    - name: Lint GitHub workflows
      run: |
        actionlint

  host-tests:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Host Tests
      command: zig build host-tests

  host-benchmarks:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Host Benchmarks
      command: zig build bench-ci

  smoke-boot:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Smoke Boot
      command: ./test_kernel.sh

  vm-memory-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM Memory Regression
      command: zig build vm-memory-regression-test

  vm-state-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM State Regression
      command: zig build vm-state-regression-test

  vm-tty-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM TTY Regression
      command: zig build vm-tty-regression-test

  vm-socket-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM Socket Regression
      command: zig build vm-socket-regression-test

  vm-event-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM Event Regression
      command: zig build vm-event-regression-test

  vm-inotify-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: VM Inotify Regression
      command: zig build vm-inotify-regression-test

  userland-smoke:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Userland Smoke
      command: zig build userland-smoke-test

  userland-sh-smoke:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Userland Sh Smoke
      command: zig build userland-sh-smoke-test

  manual-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Manual Regression
      command: zig build manual-regression-test

  smp-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: SMP Regression
      command: zig build smp-regression-test

  ext2-regression:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Ext2 Regression
      command: zig build ext2-regression-test

  kernel-bench:
    uses: ./.github/workflows/run-zig-summary-command.yml
    with:
      job-name: Kernel Bench
      command: zig build kernel-bench-test
      log-path: build/kernel-benchmark.log
      summary-script: scripts/render-kernel-benchmark-summary.sh
      summary-path: build/kernel-benchmark-summary.md
      artifact-name: kernel-benchmark-log

  smp-stress:
    uses: ./.github/workflows/run-zig-summary-command.yml
    with:
      job-name: SMP Stress
      command: zig build smp-stress-test
      log-path: build/smp-stress.log
      summary-script: scripts/render-smp-stress-summary.sh
      summary-path: build/smp-stress-summary.md
      artifact-name: smp-stress-log

  pr-ci-summary:
    runs-on: ubuntu-latest
    needs: [kernel-bench, smp-stress]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Download kernel benchmark artifact
      continue-on-error: true
      uses: actions/download-artifact@v8.0.1
      with:
        name: kernel-benchmark-log
        path: artifacts/kernel-bench

    - name: Download SMP stress artifact
      continue-on-error: true
      uses: actions/download-artifact@v8.0.1
      with:
        name: smp-stress-log
        path: artifacts/smp-stress

    - name: Comment CI summaries on PR
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs')
          const path = require('path')

          function findFile(dir, fileName) {
            if (!fs.existsSync(dir)) {
              return null
            }
            const entries = fs.readdirSync(dir, { withFileTypes: true })
            for (const entry of entries) {
              const entryPath = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                const nested = findFile(entryPath, fileName)
                if (nested) {
                  return nested
                }
                continue
              }
              if (entry.name === fileName) {
                return entryPath
              }
            }
            return null
          }

          function extractStatus(summary) {
            const overallMatch = summary.match(/- Overall status: `([^`]+)`/)
            if (overallMatch) {
              return overallMatch[1]
            }

            const tableMatch = summary.match(/\| Status \| `([^`]+)` \|/)
            if (tableMatch) {
              return tableMatch[1]
            }

            return 'UNKNOWN'
          }

          const marker = '<!-- kernel-ci-summary -->'
          const sections = []
          const sectionStatuses = {}

          for (const [label, dir, fileName] of [
            ['bench', 'artifacts/kernel-bench', 'kernel-benchmark-summary.md'],
            ['smp', 'artifacts/smp-stress', 'smp-stress-summary.md'],
          ]) {
            const filePath = findFile(dir, fileName)
            if (!filePath) {
              sectionStatuses[label] = 'MISSING'
              continue
            }
            const summary = fs.readFileSync(filePath, 'utf8').trim()
            sections.push(summary)
            sectionStatuses[label] = extractStatus(summary)
          }

          if (sections.length === 0) {
            core.warning('No CI summary artifacts were available to comment on the PR')
            return
          }

          const statusValues = Object.values(sectionStatuses)
          const overallStatus = statusValues.every((status) => status === 'PASS') ? 'PASS' : 'FAIL'
          const badge = overallStatus === 'PASS' ? ':white_check_mark:' : ':x:'
          const benchStatus = sectionStatuses.bench ?? 'MISSING'
          const smpStatus = sectionStatuses.smp ?? 'MISSING'
          const headline = `${badge} Overall CI summary: \`${overallStatus}\` | bench: \`${benchStatus}\` | smp: \`${smpStatus}\``
          const body = `${marker}\n## Kernel CI Summary\n\n${headline}\n\n${sections.join('\n\n')}`
          const issue_number = context.payload.pull_request.number

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100,
          })

          const existing = comments.find((comment) =>
            comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
          )

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
            return
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            body,
          })

  boot-iso:
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: ISO Boot
      command: zig build boot-test
