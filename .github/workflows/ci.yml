name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  zig-toolchain:
    name: Zig Toolchain Cache
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci
      with:
        install-build-dependencies: "false"

  lint:
    needs: zig-toolchain
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up ZigOS CI
      uses: ./.github/actions/setup-zigos-ci
      with:
        install-build-dependencies: "false"

    - name: Install zlint
      run: |
        curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.7.9/zlint-linux-x86_64 -o /usr/local/bin/zlint
        chmod +x /usr/local/bin/zlint

    - name: Install actionlint
      run: |
        curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
        tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
        install /tmp/actionlint /usr/local/bin/actionlint

    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck

    - name: Run lint target
      env:
        ZIGOS_REQUIRE_ZLINT: "1"
        ZIGOS_REQUIRE_ACTIONLINT: "1"
      run: |
        ./scripts/zig.sh build lint

  kernel-build:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Kernel Build
      command: ./scripts/zig.sh build -Doptimize=ReleaseFast kernel
      install-build-dependencies: false

  spec-conformance:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Spec Conformance
      command: ./scripts/zig.sh build -Doptimize=ReleaseFast spec-conformance

  host-tests:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Host Tests
      command: ./scripts/zig.sh build host-tests
      install-build-dependencies: false

  native-smoke:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Native Smoke
      command: ./scripts/zig.sh build -Doptimize=ReleaseFast zigos-native-smoke-test
      timeout-minutes: 30

  long-mode-entry:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: x86-64 Boot Path
      command: ./scripts/zig.sh build -Doptimize=ReleaseFast x86_64-long-mode-entry-check x86_64-userspace-launch-check
      timeout-minutes: 10

  benchmark:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-summary-command.yml
    with:
      job-name: Native Benchmarks
      command: QEMU_ACCELERATOR=kvm ./scripts/zig.sh build -Doptimize=ReleaseFast benchmark
      log-path: build/kernel-benchmark.log
      summary-path: build/kernel-benchmark-summary.md
      artifact-name: kernel-benchmark
      timeout-minutes: 20

  iso:
    needs: zig-toolchain
    uses: ./.github/workflows/run-zig-command.yml
    with:
      job-name: Production and Verification ISO Build
      command: ./scripts/zig.sh build -Doptimize=ReleaseFast iso iso-verification
      timeout-minutes: 20
