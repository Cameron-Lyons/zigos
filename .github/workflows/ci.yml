name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Install zlint
      run: |
        curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.7.9/zlint-linux-x86_64 -o /usr/local/bin/zlint
        chmod +x /usr/local/bin/zlint

    - name: Install actionlint
      run: |
        curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
        tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
        install /tmp/actionlint /usr/local/bin/actionlint

    - name: Lint Zig sources
      run: |
        zlint -f github --deny-warnings src

    - name: Lint GitHub workflows
      run: |
        actionlint

  host-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run host-side unit tests
      run: |
        zig build host-tests

  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Build kernel profiles
      run: |
        zig build kernel
        zig build kernel-ci-smoke
        zig build kernel-test-vm
        zig build kernel-bench
        zig build kernel-smp-stress
        zig build kernel-userland-smoke
        zig build userland
        zig build rootfs

  smoke-boot:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Smoke boot kernel
      run: |
        ./test_kernel.sh

  vm-test:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run VM test profile
      run: |
        zig build run-test-vm

  userland-smoke:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run userland smoke profile
      run: |
        zig build userland-smoke-test

  kernel-bench:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run kernel benchmark profile
      run: |
        zig build kernel-bench-test

    - name: Render kernel benchmark summary
      if: always()
      run: |
        mkdir -p build
        bash scripts/render-kernel-benchmark-summary.sh build/kernel-benchmark.log > build/kernel-benchmark-summary.md
        cat build/kernel-benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload kernel benchmark log
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: kernel-benchmark-log
        path: |
          build/kernel-benchmark.log
          build/kernel-benchmark-summary.md
        if-no-files-found: warn

  smp-stress:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run SMP stress profile
      run: |
        zig build smp-stress-test

    - name: Render SMP stress summary
      if: always()
      run: |
        mkdir -p build
        bash scripts/render-smp-stress-summary.sh build/smp-stress.log > build/smp-stress-summary.md
        cat build/smp-stress-summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SMP stress log
      if: always()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: smp-stress-log
        path: |
          build/smp-stress.log
          build/smp-stress-summary.md
        if-no-files-found: warn

  pr-ci-summary:
    runs-on: ubuntu-latest
    needs: [kernel-bench, smp-stress]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Download kernel benchmark artifact
      continue-on-error: true
      uses: actions/download-artifact@v8.0.1
      with:
        name: kernel-benchmark-log
        path: artifacts/kernel-bench

    - name: Download SMP stress artifact
      continue-on-error: true
      uses: actions/download-artifact@v8.0.1
      with:
        name: smp-stress-log
        path: artifacts/smp-stress

    - name: Comment CI summaries on PR
      continue-on-error: true
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs')
          const path = require('path')

          function findFile(dir, fileName) {
            if (!fs.existsSync(dir)) {
              return null
            }
            const entries = fs.readdirSync(dir, { withFileTypes: true })
            for (const entry of entries) {
              const entryPath = path.join(dir, entry.name)
              if (entry.isDirectory()) {
                const nested = findFile(entryPath, fileName)
                if (nested) {
                  return nested
                }
                continue
              }
              if (entry.name === fileName) {
                return entryPath
              }
            }
            return null
          }

          function extractStatus(summary) {
            const overallMatch = summary.match(/- Overall status: `([^`]+)`/)
            if (overallMatch) {
              return overallMatch[1]
            }

            const tableMatch = summary.match(/\| Status \| `([^`]+)` \|/)
            if (tableMatch) {
              return tableMatch[1]
            }

            return 'UNKNOWN'
          }

          const marker = '<!-- kernel-ci-summary -->'
          const sections = []
          const sectionStatuses = {}

          for (const [label, dir, fileName] of [
            ['bench', 'artifacts/kernel-bench', 'kernel-benchmark-summary.md'],
            ['smp', 'artifacts/smp-stress', 'smp-stress-summary.md'],
          ]) {
            const filePath = findFile(dir, fileName)
            if (!filePath) {
              sectionStatuses[label] = 'MISSING'
              continue
            }
            const summary = fs.readFileSync(filePath, 'utf8').trim()
            sections.push(summary)
            sectionStatuses[label] = extractStatus(summary)
          }

          if (sections.length === 0) {
            core.warning('No CI summary artifacts were available to comment on the PR')
            return
          }

          const statusValues = Object.values(sectionStatuses)
          const overallStatus = statusValues.every((status) => status === 'PASS') ? 'PASS' : 'FAIL'
          const badge = overallStatus === 'PASS' ? ':white_check_mark:' : ':x:'
          const benchStatus = sectionStatuses.bench ?? 'MISSING'
          const smpStatus = sectionStatuses.smp ?? 'MISSING'
          const headline = `${badge} Overall CI summary: \`${overallStatus}\` | bench: \`${benchStatus}\` | smp: \`${smpStatus}\``
          const body = `${marker}\n## Kernel CI Summary\n\n${headline}\n\n${sections.join('\n\n')}`
          const issue_number = context.payload.pull_request.number

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            per_page: 100,
          })

          const existing = comments.find((comment) =>
            comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker),
          )

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            })
            return
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number,
            body,
          })

  boot-iso:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run ISO boot test
      run: |
        zig build boot-test
