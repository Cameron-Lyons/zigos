name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Install zlint
      run: |
        curl -fsSL https://github.com/DonIsaac/zlint/releases/download/v0.7.9/zlint-linux-x86_64 -o /usr/local/bin/zlint
        chmod +x /usr/local/bin/zlint

    - name: Lint
      run: |
        zlint -f github --deny-warnings src

  host-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run host-side unit tests
      run: |
        zig build host-tests

  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Build kernel profiles
      run: |
        zig build kernel
        zig build kernel-ci-smoke
        zig build kernel-test-vm
        zig build kernel-userland-smoke
        zig build userland
        zig build rootfs

  smoke-boot:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Smoke boot kernel
      run: |
        ./test_kernel.sh

  vm-test:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run VM test profile
      run: |
        zig build run-test-vm

  userland-smoke:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run userland smoke profile
      run: |
        zig build userland-smoke-test

  boot-iso:
    runs-on: ubuntu-latest
    needs: [build-kernel]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.2

    - name: Install build dependencies
      run: |
        ./scripts/setup-deps.sh

    - name: Run ISO boot test
      run: |
        zig build boot-test
